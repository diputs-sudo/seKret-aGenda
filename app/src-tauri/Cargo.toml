[package]
name = "secret-agenda"
version = "0.1.0"
description = "Desktop IDE/workspace for competitive debate"
authors = ["Secret Agenda"]
edition = "2021"

[lib]
name = "secret_agenda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "secret-agenda"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }
vcpkg = "0.2"

[dependencies]
html-escape = "0.2"
open = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
