name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - app/**
      - .github/workflows/build-windows.yml

permissions:
  contents: read

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable MSVC C++ tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install native DOCX dependencies
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          & (Join-Path $vcpkgRoot "vcpkg.exe") install minizip libxml2 sqlite3 --triplet x64-windows-static-md
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build NSIS installer
        run: npm run build:windows

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: secret-agenda-windows-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
